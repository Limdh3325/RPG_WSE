name: wse-m0-dev
services:
  postgres:
    image: postgres:16.11-bookworm
    environment:
      POSTGRES_USER: wse_dev
      POSTGRES_PASSWORD: ${WSE_POSTGRES_PASSWORD:?Set WSE_POSTGRES_PASSWORD in deploy/.env}
      POSTGRES_DB: wse_dev
    ports:
      - "127.0.0.1:${WSE_POSTGRES_PORT:-55432}:5432"
    volumes:
      - wse_dev_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wse_dev -d wse_dev"]
      interval: 5s
      timeout: 3s
      retries: 12
volumes:
  wse_dev_pgdata:
